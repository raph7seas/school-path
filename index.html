<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Our school path</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  :root{--bg:#F3F5F8;--surface:#fff;--ink:#142033;--muted:#5A6577;--line:#DAE0E8;--accent:#2B50D8;--bad:#B42318}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Atkinson Hyperlegible',system-ui,sans-serif}
  #gate{min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box}
  .card{width:100%;max-width:380px;background:var(--surface);border:3px solid var(--ink);border-radius:18px;padding:28px 24px;box-sizing:border-box}
  h1{font:800 28px/1.1 'Bricolage Grotesque',system-ui,sans-serif;margin:0 0 6px}
  p{margin:0 0 18px;color:var(--muted)}
  label{display:block;font-weight:700;margin:12px 0 4px}
  input{width:100%;box-sizing:border-box;font:inherit;padding:11px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
  input:focus{outline:none;border-color:var(--accent)}
  button{font:inherit;font-weight:700;cursor:pointer;border-radius:10px}
  .go{width:100%;margin-top:18px;padding:12px;border:0;background:var(--accent);color:#fff}
  .go:disabled{opacity:.6;cursor:wait}
  .link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline}
  .swap{margin:14px 0 0;text-align:center;color:var(--muted)}
  #msg{margin:12px 0 0;min-height:1.5em;color:var(--bad)}
  #msg.ok{color:var(--muted)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="gate">
  <form class="card" id="form">
    <h1>Our school path</h1>
    <p id="lede">Sign in to see the family plan.</p>
    <div id="creds">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
    </div>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" minlength="8" required>
    <button class="go" id="go" type="submit">Sign in</button>
    <div id="msg" role="status"></div>
    <p class="swap" id="swap">First time here? <button class="link" type="button" id="mode">Create your password</button></p>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
(() => {
const URL_ = 'https://wfwbaqvcargijhgewyqs.supabase.co', KEY = 'sb_publishable_znMrJ3oQGNqOkI7sEWCy4g_38KSwJbi';
const sb = supabase.createClient(URL_, KEY);
const $ = s => document.querySelector(s);
let mode = 'in', started = false, recovering = /type=recovery/.test(location.hash);

// ---- sign in / create password ----
const say = (t, ok) => { $('#msg').textContent = t; $('#msg').className = ok ? 'ok' : ''; };
function setMode(m){
  mode = m;
  $('#creds').hidden = m === 'reset'; $('#email').required = m !== 'reset';
  $('#go').textContent = m === 'up' ? 'Create password' : m === 'reset' ? 'Save new password' : 'Sign in';
  $('#pw').autocomplete = m !== 'in' ? 'new-password' : 'current-password';
  $('#lede').textContent = m === 'reset' ? 'Pick a new password (8 or more characters).' : m === 'up' ? 'Use your family email and pick a password (8 or more characters).' : 'Sign in to see the family plan.';
  $('#swap').innerHTML = m === 'up' ? 'Already set up? <button class="link" type="button" id="mode">Sign in</button>' : 'First time here? <button class="link" type="button" id="mode">Create your password</button>';
  $('#mode').onclick = () => setMode(m === 'up' ? 'in' : 'up');
  $('#swap').hidden = m === 'reset';
  say('');
}
$('#mode').onclick = () => setMode('up');
if (recovering) setMode('reset');
$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('#email').value.trim(), password = $('#pw').value;
  $('#go').disabled = true; say('');
  if (mode === 'reset'){
    const { error } = await sb.auth.updateUser({ password });
    $('#go').disabled = false;
    if (error) return say(error.message);
    recovering = false; started = true; return start((await sb.auth.getSession()).data.session);
  }
  const { data, error } = mode === 'up' ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
  $('#go').disabled = false;
  if (error) return say(mode === 'up' && /database error/i.test(error.message) ? 'This app is private to one family. Check the email address.' : error.message);
  if (mode === 'up' && !data.session) say('Check your email to confirm, then sign in here.', true);
});
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY'){ recovering = true; setMode('reset'); return; }
  if (session && !started && !recovering){ started = true; setTimeout(() => start(session)); }
  if (event === 'SIGNED_OUT' && started) location.reload();
});

// ---- open the page: the app is stored encrypted, the key is readable only by the family ----
async function start(session){
  say('Opening...', true);
  try {
    const { data: row, error } = await sb.from('app_key').select('key').maybeSingle();
    if (error || !row) throw new Error('This account is not on the family list.');
    const raw = Uint8Array.from(atob(row.key), c => c.charCodeAt(0));
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const res = await fetch('app.enc', { cache: 'no-cache' });
    if (!res.ok) throw new Error('Could not load the page. Try again.');
    const buf = new Uint8Array(await res.arrayBuffer());
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12)));
    window.claude = shim(session);
    mount(html, session.user.email);
  } catch (e) {
    started = false; say(e.message || 'Could not open the page.');
    await sb.auth.signOut({ scope: 'local' });
  }
}
function mount(html, email){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  $('#gate').remove(); document.querySelector('style').remove();
  const nodes = [...doc.head.children].filter(n => !/^(META|TITLE)$/.test(n.tagName)).concat([...doc.body.childNodes]);
  nodes.forEach(n => document.body.appendChild(document.adoptNode(n)));
  const foot = document.createElement('div'); foot.style.cssText = 'text-align:center;font-size:14px;opacity:.7;padding:24px 16px 96px';
  foot.innerHTML = 'Signed in as <span></span> &middot; <button class="link" type="button" style="background:none;border:0;color:inherit;text-decoration:underline;font:inherit;cursor:pointer">Sign out</button>';
  foot.querySelector('span').textContent = email; foot.querySelector('button').onclick = () => sb.auth.signOut();
  document.body.appendChild(foot);
  // Scripts added through a parser do not run; re-create them so they do, in order. Only the app's own, never this page's.
  nodes.flatMap(n => n.tagName === 'SCRIPT' ? [n] : n.querySelectorAll ? [...n.querySelectorAll('script')] : []).forEach(old => { const s = document.createElement('script'); s.textContent = old.textContent; old.replaceWith(s); });
}

// ---- the same window.claude the page uses inside claude.ai, backed by Supabase ----
function shim(session){
  // cache[col]: id -> {data, at}. `at` is the server's write time, so an older copy never replaces a newer one.
  const cache = {}, ready = {}, loading = {}, touched = {}, colSubs = {}, docSubs = {};
  const t = at => Date.parse(at) || 0;
  const snap = col => ({ docs: [...cache[col]].map(([id, d]) => ({ id, exists: true, data: () => d.data })) });
  function emit(col){
    if (!ready[col]) return;
    (colSubs[col] || new Set()).forEach(s => s.next(snap(col)));
    Object.entries(docSubs).forEach(([path, subs]) => {
      if (!path.startsWith(col + '/')) return;
      const d = cache[col].get(path.slice(col.length + 1));
      subs.forEach(s => s.next({ exists: !!d, data: () => d && d.data }));
    });
  }
  function apply(col, id, row){ // row null = deleted
    const m = cache[col] ||= new Map(), cur = m.get(id);
    (touched[col] ||= new Set()).add(id);
    if (!row) m.delete(id); else if (!cur || t(row.at) >= t(cur.at)) m.set(id, row);
  }
  function load(col){
    if (loading[col]) return loading[col];
    cache[col] ||= new Map(); touched[col] = new Set();
    return loading[col] = sb.from('docs').select('id,data,updated_at').eq('col', col).then(({ data, error }) => {
      delete loading[col];
      if (error){ (colSubs[col] || new Set()).forEach(s => s.err && s.err(error)); throw error; }
      const seen = new Set(data.map(r => r.id)), live = touched[col];
      data.forEach(r => { const cur = cache[col].get(r.id); if (!cur || t(r.updated_at) >= t(cur.at)) cache[col].set(r.id, { data: r.data, at: r.updated_at }); });
      [...cache[col].keys()].forEach(id => { if (!seen.has(id) && !live.has(id)) cache[col].delete(id); }); // deleted while we were away
      ready[col] = true; emit(col);
    });
  }
  sb.channel('docs').on('postgres_changes', { event: '*', schema: 'public', table: 'docs' }, p => {
    const r = p.eventType === 'DELETE' ? p.old : p.new;
    if (!r || !cache[r.col]) return;
    apply(r.col, r.id, p.eventType === 'DELETE' ? null : { data: r.data, at: r.updated_at });
    emit(r.col);
  }).subscribe(status => { if (status === 'SUBSCRIBED') Object.keys(cache).forEach(c => load(c).catch(() => {})); }); // catch up after a reconnect
  const watch = (map, key, col, sub) => {
    (map[key] ||= new Set()).add(sub);
    if (ready[col]) emit(col); else load(col).catch(() => {});
    return () => map[key].delete(sub);
  };
  const fail = error => Object.assign(new Error(error.message), { code: 'unavailable' });
  const db = {
    collection: col => ({ onSnapshot: (next, err) => watch(colSubs, col, col, { next, err }) }),
    doc: path => {
      const [col, id] = [path.slice(0, path.indexOf('/')), path.slice(path.indexOf('/') + 1)];
      return {
        async set(data){
          const { data: rows, error } = await sb.from('docs').upsert({ col, id, data }).select('updated_at');
          if (error) throw fail(error);
          apply(col, id, { data, at: rows[0].updated_at }); emit(col);
        },
        async delete(){
          const { error } = await sb.from('docs').delete().eq('col', col).eq('id', id);
          if (error) throw fail(error);
          apply(col, id, null); emit(col);
        },
        onSnapshot: (next, err) => watch(docSubs, path, col, { next, err }),
      };
    },
  };
  let names = null;
  const user = {
    id: async () => session.user.id,
    profiles: async ids => {
      names ||= sb.rpc('family_members').then(({ data }) => Object.fromEntries((data || []).map(r => [r.id, { name: r.name }])));
      const all = await names;
      return Object.fromEntries(ids.map(id => [id, all[id] || { name: '' }]));
    },
  };
  // Ask Claude runs through the family's own edge function. The page's tools run here, in the page.
  async function sample(turns, opts = {}){
    const tools = opts.tools || [], messages = turns.map(t => ({ role: t.role, content: t.content }));
    let text = '';
    for (let round = 0; round < 4; round++){ // ponytail: one tool (save_note), so a few rounds is plenty
      let res;
      try {
        const { data: { session: s } } = await sb.auth.getSession();
        res = await fetch(URL_ + '/functions/v1/ask', { method: 'POST', signal: opts.signal,
          headers: { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + s.access_token },
          body: JSON.stringify({ messages, tools: tools.length > 0 }) });
      } catch (e) { throw Object.assign(new Error('cancelled'), { code: e.name === 'AbortError' ? 'cancelled' : 'unavailable', text }); }
      const out = await res.json().catch(() => ({}));
      if (!res.ok || out.code) throw Object.assign(new Error(out.message || 'Ask failed'), { code: out.code || (res.status === 401 ? 'session_expired' : 'unavailable'), text });
      const said = out.content.filter(b => b.type === 'text').map(b => b.text).join('');
      text += (text && said ? '\n\n' : '') + said;
      if (out.stop_reason !== 'tool_use'){
        if (!text) throw Object.assign(new Error('empty'), { code: 'empty_completion' });
        opts.onText && opts.onText({ text, delta: said });
        return { text, truncated: out.stop_reason === 'max_tokens' };
      }
      messages.push({ role: 'assistant', content: out.content });
      messages.push({ role: 'user', content: await Promise.all(out.content.filter(b => b.type === 'tool_use').map(async b => {
        const t = tools.find(x => x.name === b.name);
        try { return { type: 'tool_result', tool_use_id: b.id, content: String(await t.execute(b.input)) }; }
        catch (e) { return { type: 'tool_result', tool_use_id: b.id, content: String(e.message || e), is_error: true }; }
      })) });
    }
    return { text, truncated: true };
  }
  sample.limits = async () => ({ tools: {} });
  const caps = { db, user, sample };
  return { use: async name => caps[name] || null };
}
})();
</script>
</body>
</html>
